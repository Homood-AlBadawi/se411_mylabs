# SE411 - Lab 06: log4j 1.2 configuration used through the SLF4J facade.
#
# rootLogger = <minimum level>, <appender name>
# Anything below the minimum level is ignored. The lab asks you to start at
# ERROR (nothing appears), then lower it to INFO, then to DEBUG.
log4j.rootLogger = INFO, LOG1

# LOG1 writes to a file rather than the console.
log4j.appender.LOG1=org.apache.log4j.FileAppender

# Output location: ./logs/App/log4j/log.out, relative to where the app runs.
log=./logs/App/log4j
log4j.appender.LOG1.File=${log}/log.out

# Append instead of truncating on every run.
log4j.appender.LOG1.Append=true

# Message format.
#   %d timestamp   %p priority   %t thread
#   %C class       %m message    %n newline
log4j.appender.LOG1.layout=org.apache.log4j.PatternLayout
log4j.appender.LOG1.layout.conversionPattern=%d %p [%t] %C - %m%n
